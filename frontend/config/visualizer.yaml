ros_domain_id: 100

topics:
  arm_status: /arm_status
  dataset_action: /execute_arm_cmd_dummy
  model_action: /execute_arm_cmd_inference_dummy
  cameras:
    top: /camera_dcw2/custom_cam_color_1M
    left: /camera_dcl_left/custom_cam_color_1M
    right: /camera_dcl_right/custom_cam_color_1M

cameras:
  enabled: [top, left, right]
  default_view: all
  sample_hz: 10.0
  jpeg_quality: 85

signals:
  enabled:
    - left_joint_0
    - left_joint_1
    - left_joint_2
    - left_joint_3
    - left_joint_4
    - left_joint_5
    - left_joint_6
    - left_gripper
    - right_joint_0
    - right_joint_1
    - right_joint_2
    - right_joint_3
    - right_joint_4
    - right_joint_5
    - right_joint_6
    - right_gripper
  sources: [state, dataset_action, model_action]
  default_visible_sources: [state, dataset_action, model_action]
  default_signal: left_joint_0

viewer:
  application_id: lerobot_ros2_visualizer
  memory_limit: 2GB
  timeline: ros_time
  history_window_s: 20.0
