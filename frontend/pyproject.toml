[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-ros2-visualizer"
version = "0.1.0"
description = "Live Rerun visualization for the LeRobot ROS 2 replay workflow"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=2,<3",
  "PyYAML>=5.4",
  "rerun-sdk==0.26.2",
]

[project.scripts]
lerobot-ros2-visualizer = "lerobot_ros2_visualizer.node:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lerobot_ros2_visualizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
